type: queuebatch
github_project: open-telemetry/opentelemetry-collector

status:
  disable_codecov_badge: true
  class: pkg
  stability:
    beta: [traces, metrics, logs]

exported_configs:
  config:
    description: Defines configuration for queueing and batching incoming requests.
    properties:
      wait_for_result:
        type: bool
        description: |
          Determines if incoming requests are blocked until the request is processed or not.
          Currently, this option is not available when persistent queue is configured using the storage configuration.
      sizer:
        type: sizer
        description: |
          Determines the type of size measurement used by this component.
          It accepts "requests", "items", or "bytes".
      queue_size:
        type: int64
        description: Represents the maximum data size allowed for concurrent storage and processing.
        exclusiveMinimum: 0
      block_on_overflow:
        type: bool
        description: |
          Determines the behavior when the component's TotalSize limit is reached.
          If true, the component will wait for space; otherwise, operations will immediately return a retryable error.
      storage:
        type: component_id
        # TODO: This will be changed to Optional when available.
        # See https://github.com/open-telemetry/opentelemetry-collector/issues/13822
        pointer: true
        description: |
          If not empty, enables the persistent storage and uses the component specified
          as a storage extension for the persistent queue.
        go_struct:
          field_name: StorageID
      num_consumers:
        type: int
        description: |
          Is the maximum number of concurrent consumers from the queue.
          This applies across all different optional configurations from above 
          (e.g. wait_for_result, block_on_overflow, storage, etc.).
        exclusiveMinimum: 0
      batch:
        $ref: batch_config
        optional: true
        description: It configures how the requests are consumed from the queue and batch together during consumption.
    go_struct:
      custom_validator:
      ignore_default: true
  batch_config:
    description: Defines a configuration for batching requests based on a timeout and a minimum number of items.
    properties:
      flush_timeout:
        type: duration
        description: Sets the time after which a batch will be sent regardless of its size.
        default: 200ms
        exclusiveMinimum: 0
      sizer:
        type: sizer
        description: |
          Determines the type of size measurement used by the batch.
          If not configured, use the same configuration as the queue.
          It accepts "requests", "items", or "bytes".
        default: "items"
        go_struct:
          custom_default:
      min_size:
        type: int64
        description: Defines the configuration for the minimum size of a batch.
        default: 8192
        minimum: 0
      max_size:
        type: int64
        description: Defines the configuration for the maximum size of a batch.
        minimum: 0
      partition:
        $ref: partition_config
        description: Defines the partitioning of the batches configuration.
    go_struct:
      custom_validator:
  partition_config:
    description: Defines a configuration for partitioning requests based on metadata keys.
    properties:
      metadata_keys:
        type: slice
        values:
          type: string
        description: |
          Is a list of client.Metadata keys that will be used to partition
          the data into batches. If this setting is empty, a single batcher instance
          will be used. When this setting is not empty, one batcher will be used per
          distinct combination of values for the listed metadata keys.

          Empty value and unset metadata are treated as distinct cases.

          Entries are case-insensitive. Duplicated entries will trigger a validation error.
        go_struct:
          custom_validator:
      cache_size:
        type: int
        description: |
          Is the maximum number of active partition batchers kept in the LRU
          cache when partitioning is enabled. When the limit is reached, the least
          recently used partition is flushed and removed. Default is 10000. Must be positive.
        default: 10000
        exclusiveMinimum: 0
      idle_timeout:
        type: duration
        description: |
          Is the duration a partition may stay empty before it is removed.
          Keep it above the data arrival interval to avoid churning partitions. Default is 90s.
          Must be positive.
        default: 90s
        exclusiveMinimum: 0
$defs:
  encoding_type:
    description: EncodingType defines the type for content encoding
    type: string
description: Config defines configuration for OTLP/HTTP exporter.
type: object
properties:
  encoding:
    description: 'The encoding to export telemetry (default: "proto")'
    $ref: encoding_type
  logs_endpoint:
    description: The URL to send logs to. If omitted the Endpoint + "/v1/logs" will be used.
    type: string
  metrics_endpoint:
    description: The URL to send metrics to. If omitted the Endpoint + "/v1/metrics" will be used.
    type: string
  profiles_endpoint:
    description: The URL to send profiles to. If omitted the Endpoint + "/v1development/profiles" will be used.
    type: string
  retry_on_failure:
    $ref: /config/configretry.back_off_config
  retryable_http_status_codes:
    description: 'Additional HTTP response status codes to treat as retryable, in addition to the codes defined by the OTLP specification (429, 502, 503 and 504). The specification requires all other 4xx and 5xx codes to be treated as non-retryable, so opting in here is a deliberate tradeoff: retrying such a response avoids dropping data, at the cost of possibly sending data that the server already rejected. Useful for intermediaries (proxies, load balancers) that answer with codes such as 408 Request Timeout.'
    type: array
    items:
      type: integer
  sending_queue:
    x-optional: true
    $ref: /exporter/exporterhelper.queue_batch_config
  traces_endpoint:
    description: The URL to send traces to. If omitted the Endpoint + "/v1/traces" will be used.
    type: string
allOf:
  - $ref: /config/confighttp.client_config

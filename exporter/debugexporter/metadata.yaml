display_name: Debug Exporter
type: debug
github_project: open-telemetry/opentelemetry-collector

status:
  disable_codecov_badge: true
  codeowners:
    active:
      - andrzej-stencel
  class: exporter
  stability:
    alpha: [traces, metrics, logs, profiles]
  distributions: [core, contrib, k8s]
  warnings: [Unstable Output Format]

sending_queue:
  support: has_overrides
  rationale: Debug output is synchronous and unbatched by default.
  overrides:
    enabled: false
    batch:
      enabled: false

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Runtime status states</title>
  <desc id="desc">OK and RecoverableError transition to each other and to themselves. Each also transitions to PermanentError and to FatalError.</desc>

  <defs>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="599" height="399" rx="10" fill="#fcfcfd" stroke="#e3e6e9"/>

  <!-- edges -->
  <g stroke-width="1.5" fill="none" stroke="#1f2328">
    <line x1="230" y1="59" x2="350" y2="59" marker-end="url(#ah2)"/>
    <line x1="350" y1="73" x2="230" y2="73" marker-end="url(#ah2)"/>
    <path d="M90,54 C58,48 58,84 90,78" marker-end="url(#ah2)"/>
    <path d="M530,54 C562,48 562,84 530,78" marker-end="url(#ah2)"/>
    <line x1="200" y1="87" x2="272" y2="188" marker-end="url(#ah2)"/>
    <line x1="400" y1="87" x2="328" y2="188" marker-end="url(#ah2)"/>
    <polyline points="130,87 130,341 228,341" marker-end="url(#ah2)"/>
    <polyline points="470,87 470,341 372,341" marker-end="url(#ah2)"/>
  </g>

  <!-- nodes -->
  <g font-size="13" text-anchor="middle">
    <rect x="90" y="45" width="140" height="42" rx="6" fill="#12855f" fill-opacity="0.14" stroke="#12855f" stroke-width="1.5"/>
    <text x="160" y="71" fill="#1f2328">OK</text>

    <rect x="350" y="45" width="180" height="42" rx="6" fill="#a26a00" fill-opacity="0.14" stroke="#a26a00" stroke-width="1.5"/>
    <text x="440" y="71" fill="#1f2328">RecoverableError</text>

    <rect x="210" y="190" width="180" height="42" rx="6" fill="#d9480f" fill-opacity="0.14" stroke="#d9480f" stroke-width="1.5"/>
    <text x="300" y="216" fill="#1f2328">PermanentError</text>

    <rect x="230" y="320" width="140" height="42" rx="6" fill="#cf2f2f" fill-opacity="0.14" stroke="#cf2f2f" stroke-width="1.5"/>
    <text x="300" y="346" fill="#1f2328">FatalError</text>
  </g>
</svg>

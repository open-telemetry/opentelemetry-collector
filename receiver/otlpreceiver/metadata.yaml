display_name: OTLP Receiver
type: otlp
github_project: open-telemetry/opentelemetry-collector

status:
  disable_codecov_badge: true
  class: receiver
  stability:
    stable: [traces, metrics, logs]
    alpha: [profiles]
  distributions: [core, contrib, k8s, otlp]

config:
  properties:
    protocols:
      $ref: protocols
  required: [protocols]

exported_configs:
  sanitized_url_path:
    type: string
  protocols:
    description: Is the configuration for the supported protocols, currently gRPC and HTTP (Proto and JSON).
    go_struct:
      custom_validator:
    properties:
      grpc:
        $ref: /config/configgrpc.server_config
        optional: true
        default:
          net_addr:
            endpoint: localhost:4317
          # We almost write 0 bytes, so no need to tune WriteBufferSize.
          read_buffer_size: 524288 # 512 * 1024
        go_struct:
          optional_mode: default
          field_name: GRPC
      http:
        $ref: http_config
        optional: true
        default:
          traces_url_path: "/v1/traces"
          metrics_url_path: "/v1/metrics"
          logs_url_path: "/v1/logs"
          server_config:
            net_addr:
              endpoint: localhost:4318
            tls: # <empty> - drop confighttp defaults
            write_timeout: 0
            read_header_timeout: 0
        go_struct:
          optional_mode: default
  http_config:
    optional: true
    properties:
      server_config:
        $ref: /config/confighttp.server_config
        embed: true
      traces_url_path:
        $ref: sanitized_url_path
        description: Is the URL path to receive traces on. If omitted "/v1/traces" will be used.
      metrics_url_path:
        $ref: sanitized_url_path
        description: Is the URL path to receive metrics on. If omitted "/v1/metrics" will be used.
      logs_url_path:
        $ref: sanitized_url_path
        description: Is the URL path to receive logs on. If omitted "/v1/logs" will be used.

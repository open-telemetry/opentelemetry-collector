# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: enhancement

# The name of the component, or a single word describing the area of concern, (e.g. receiver/otlp)
component: cmd/schemagen

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Handle interface fields, named map types, `remain` fields, `UnmarshalText` types and recursive types.

# One or more tracking issues or pull requests related to the change
issues: [16456]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the changelog.
# Use pipe (|) for multiline entries.
subtext: |
  - A field of type `interface{}` or of a named interface type accepts any value. Before, schemagen failed on the first and dropped the second. A named interface type is kept as a definition, so a field of another package can refer to it.
  - A named map type such as `type Headers map[string]string` is kept as a definition.
  - A field tagged `mapstructure:",remain"` sets `additionalProperties` of its object and is no longer a property.
  - A type with an `UnmarshalText([]byte) error` method is emitted as a string.
  - With `-r`, a type that contains itself is cut at the nested occurrence, which accepts any value.
  - With `-r`, a reference to a named slice or map type is always resolved. Before, it could stay in the output depending on map iteration order.

# Optional: The change log or logs in which this entry should be rendered.
# e.g. '[user]' or '[user, api]'.
# Include 'user' if the change is relevant to end users.
# Include 'api' if there is a change to a library API.
# Default: '[user]'
change_logs: [api]

change_type: enhancement

component: pkg/exporterhelper

note: Add support for `requests` sizer in the exporter batcher.

issues: [12880]

subtext: |
  Previously the batch configuration only accepted `items` or `bytes` as a sizer. With this change,
  `requests` is a valid `batch::sizer`. `min_size` counts incoming export calls, while `max_size` has
  no effect because requests are merged regardless of payload size.


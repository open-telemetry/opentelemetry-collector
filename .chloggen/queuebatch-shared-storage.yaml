# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: bug_fix

# The name of the component, or a single word describing the area of concern, (e.g. receiver/otlp)
component: processor/queue_batch

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Reject a configuration where one `queue_batch` instance with `storage` is used in more than one pipeline of the same signal.

# One or more tracking issues or pull requests related to the change
issues: [16398]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the changelog.
# Use pipe (|) for multiline entries.
subtext: |
  The persistent queue is identified by the component ID and the signal, so both pipelines used the same
  stored queue and data from one pipeline could be lost or delivered to the exporters of the other.
  Configure a separate named instance for each pipeline, for example `queue_batch/a` and `queue_batch/b`.

# Optional: The change log or logs in which this entry should be rendered.
# e.g. '[user]' or '[user, api]'
# Include 'user' if the change is relevant to end users.
# Include 'api' if there is a change to a library API.
# Default: '[user]'
change_logs: [user]

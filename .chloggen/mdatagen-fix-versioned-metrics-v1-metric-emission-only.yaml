# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: bug_fix

# The name of the component, or a single word describing the area of concern, (e.g. receiver/otlp)
component: cmd/mdatagen

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
# note: When using versioned metrics, and setting both through gates on only the latest metric should be emitted
note: When both migration gates are enabled, only the latest metric with its v1 attributes is emitted (legacy attributes are no longer included).

# One or more tracking issues or pull requests related to the change
issues: [15979]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  This bug was found when attempting to only emit v1 metrics using the through_gates approach in
  mdatagen. If both gates are enabled we expect to only see the v1 metric and its attributes. But
  it was found that enabling both gates would emit the v1 metric with legacy and latest attributes.

  We expect the v1 metric to be emitted with both legacy and v1 attributes when only using the enable-new
  gate. This scenario would happen when a versioned metric shared the same name with the legacy metric but
  its attributes changed.


change_type: enhancement
component: pkg/extensionmiddleware
note: Add the optional `GRPCServerInTap` interface for gRPC server middleware that checks requests before the server reads the request message.
issues: [16184]
subtext: |
  `configgrpc` combines the tap handles of all configured middlewares into one `grpc.InTapHandle`.
  It returns an error when a middleware returns `grpc.InTapHandle` from `GetGRPCServerOptions`,
  and, instead of panicking at startup, when the server options set more than one tap handle.
  The interface returns `tap.ServerInHandle` from `google.golang.org/grpc/tap`, which grpc-go marks as experimental,
  so the interface may change if that package does.
change_logs: [api]

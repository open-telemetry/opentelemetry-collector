change_type: enhancement

component: processor/queuebatch

note: Report queue and batch telemetry using processor-oriented metrics

issues: [14038]

subtext: |
  The processor reports `otelcol_processor_queuebatch_*` instruments with
  `processor` and `otel.signal` attributes instead of exporterhelper's
  `otelcol_exporter_*` instruments. It does not emit any `otelcol_exporter_*`
  metric. The default metric views apply the same telemetry-level filtering
  these instruments get under their exporterhelper names: the batch size
  histograms are dropped and the `error.type`/`error.permanent` attributes are
  excluded below the `detailed` level. Spans and log messages are still emitted
  by exporterhelper and remain exporter-oriented; see the component README.


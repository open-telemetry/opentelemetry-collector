change_type: enhancement

component: exporter/exporterhelper

note: Add `WithObsMetrics` to let components reusing exporterhelper report its observation events through their own instruments

issues: [14038]

subtext: |
  `NewObsMetrics` builds an `ObsMetrics` from an `ObsMetricsConfig` of
  operations. Exporterhelper defines the meaning and timing of each operation,
  calls `Shutdown` once it takes ownership, and falls back to its own
  `otelcol_exporter_*` instruments when the option is not used.


change_type: enhancement

component: pkg/exporterhelper

note: Add `WithObsMetrics` to let components reusing exporterhelper report its observation events through their own instruments

issues: [14038]

subtext: |
  `ObsMetrics` is an interface with a corresponding function type per
  operation; the zero value of `FuncObsMetrics` implements all of them as
  no-ops. Exporterhelper defines the meaning and timing of each operation,
  takes ownership of the metrics once its constructor returns successfully,
  and falls back to its own `otelcol_exporter_*` instruments when the option
  is not used.


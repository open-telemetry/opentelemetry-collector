name: FOSSA scanning

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  fossa:
    permissions:
      contents: read # for actions/checkout
    uses: open-telemetry/shared-workflows/.github/workflows/fossa.yml@f09a36e1fa2576787fe05cbc1313ef6066918c78 # v0.23.0
    secrets:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}

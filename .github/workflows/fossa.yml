name: FOSSA scanning

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  fossa:
    permissions:
      contents: read # for actions/checkout
    uses: open-telemetry/shared-workflows/.github/workflows/fossa.yml@22c6d43ead71f463aa2b16ddb7081e94d2ad6a0e # v0.26.0
    secrets:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}

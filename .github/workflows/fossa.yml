name: FOSSA scanning

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  fossa:
    permissions:
      contents: read # for actions/checkout
    uses: open-telemetry/shared-workflows/.github/workflows/fossa.yml@30362d425ab746bb2ec4647538ea9154591cce91 # v0.22.0
    secrets:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}

name: Zizmor

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '44 17 * * 1' # weekly at 17:44 UTC on Monday
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read # for actions/checkout
      security-events: write # for zizmor to upload SARIF results
    uses: open-telemetry/shared-workflows/.github/workflows/zizmor.yml@f09a36e1fa2576787fe05cbc1313ef6066918c78 # v0.23.0
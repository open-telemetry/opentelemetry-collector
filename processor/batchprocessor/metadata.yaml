display_name: Batch Processor
type: batch
description: |
  > [!WARNING]
  > **The `batch` processor is deprecated for traces, metrics, and logs.**
  > For most pipelines, enable [exporter-level batching (`sending_queue.batch`)](../../exporter/exporterhelper/README.md#sending-queue-batch-settings)
  > on each exporter that supports it and remove `batch` from the pipeline.
  > If you need to batch before another processor or share batches across multiple exporters,
  > use the [`queue_batch` processor](../queuebatchprocessor/README.md) instead.
  >
  > See the [migration blog post](https://opentelemetry.io/blog/2026/collector-batching-migration/) for configuration examples
  > and the [migration RFC](../../docs/rfcs/batching-migration.md) for the rationale and rollout plan.
github_project: open-telemetry/opentelemetry-collector

status:
  disable_codecov_badge: true
  class: processor
  stability:
    deprecated: [traces, metrics, logs]
  deprecation:
    traces: &batch_deprecation
      date: "2026-11-24"
      migration: "Use exporter-level batching or the `queue_batch` processor. See the [migration guide](https://opentelemetry.io/blog/2026/collector-batching-migration/)."
    metrics: *batch_deprecation
    logs: *batch_deprecation
  distributions: [core, contrib, k8s]

tests:
  # The batch processor buffers data and flushes it on a detached context, so it
  # cannot propagate the incoming context to the next consumer.
  skip_context_propagation: true

telemetry:
  metrics:
    processor_batch_batch_send_size:
      enabled: true
      stability: development
      description: Number of units in the batch
      unit: "{unit}"
      histogram:
        value_type: int
        bucket_boundaries:
          [
            10,
            25,
            50,
            75,
            100,
            250,
            500,
            750,
            1000,
            2000,
            3000,
            4000,
            5000,
            6000,
            7000,
            8000,
            9000,
            10000,
            20000,
            30000,
            50000,
            100000,
          ]
    processor_batch_batch_send_size_bytes:
      enabled: true
      stability: development
      description: Number of bytes in batch that was sent. Only available on detailed level.
      unit: By
      histogram:
        value_type: int
        bucket_boundaries:
          [
            128,
            256,
            512,
            1024,
            2048,
            4096,
            8192,
            16384,
            32768,
            65536,
            131072,
            262144,
            524288,
            1048576,
            2097152,
            4194304,
            8388608,
            16777216,
          ]
    processor_batch_batch_size_trigger_send:
      enabled: true
      stability: development
      description: Number of times the batch was sent due to a size trigger
      unit: "{time}"
      sum:
        value_type: int
        monotonic: true
    processor_batch_metadata_cardinality:
      enabled: true
      stability: development
      description: Number of distinct metadata value combinations being processed
      unit: "{combination}"
      sum:
        value_type: int
        async: true
    processor_batch_timeout_trigger_send:
      enabled: true
      stability: development
      description: Number of times the batch was sent due to a timeout trigger
      unit: "{time}"
      sum:
        value_type: int
        monotonic: true

config:
  description: Config defines configuration for batch processor.
  go_struct:
    custom_validator:
      name: validateConfig
  properties:
    timeout:
      type: duration
      description: |
        Sets the time after which a batch will be sent regardless of size.
        When this is set to zero, batched data will be sent immediately.
      default: 200ms
    send_batch_size:
      type: uint32
      description: |
        Is the size of a batch which after hit, will trigger it to be sent.
        When this is set to zero, the batch size is ignored and data will be sent immediately
        subject to only send_batch_max_size.
      default: 8192
    send_batch_max_size:
      type: uint32
      description: |
        Is the maximum size of a batch. It must be larger than send_batch_size.
        Larger batches are split into smaller units.
        Default value is 0, that means no maximum size.
      default: 0
    metadata_keys:
      type: slice
      values:
        type: string
      description: |
        Is a list of client.Metadata keys that will be
        used to form distinct batchers. If this setting is empty,
        a single batcher instance will be used. When this setting
        is not empty, one batcher will be used per distinct
        combination of values for the listed metadata keys.

        Empty value and unset metadata are treated as distinct cases.

        Entries are case-insensitive. Duplicated entries will
        trigger a validation error.
    metadata_cardinality_limit:
      type: uint32
      description: |
        Indicates the maximum number of
        batcher instances that will be created through a distinct
        combination of metadata_keys.
      default: 1000

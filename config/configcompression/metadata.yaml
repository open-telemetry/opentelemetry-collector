type: configcompression
parent: config
github_project: open-telemetry/opentelemetry-collector

status:
  disable_codecov_badge: true
  class: pkg

exported_configs:
  compression_params:
    type: object
    properties:
      level:
        $ref: level
        optional: true
      max_bytes:
        description: Maximum number of raw bytes that can be processed before an error is raised.
        type: int64
        optional: true
        default: 1000000
  level:
    type: int
  type:
    description: Type represents a compression method
    type: string
    enum:
      - "gzip"
      - "zlib"
      - "deflate"
      - "snappy"
      - "x-snappy-framed"
      - "zstd"
      - "lz4"
      - "none"
      - ""

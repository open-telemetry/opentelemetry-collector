$defs:
  back_off_config:
    description: BackOffConfig defines configuration for retrying batches in case of export failure. The current supported strategy is exponential backoff.
    type: object
    properties:
      enabled:
        description: Enabled indicates whether to retry sending batches in case of export failure.
        type: boolean
      initial_interval:
        description: InitialInterval the time to wait after the first failure before retrying; ignored if enabled is false.
        type: string
        x-customType: time.Duration
        format: duration
      max_elapsed_time:
        description: MaxElapsedTime the maximum amount of time (including retries) spent trying to send a request/batch; ignored if enabled is false. Once this value is reached, the data is discarded. If set to 0, the retries are never stopped.
        type: string
        x-customType: time.Duration
        format: duration
      max_interval:
        description: MaxInterval the upper bound on backoff interval; ignored if enabled is false. Once this value is reached the delay between consecutive retries will always be `MaxInterval`.
        type: string
        x-customType: time.Duration
        format: duration
      multiplier:
        description: Multiplier the factor by which the backoff interval bounds are multiplied on each attempt; ignored if enabled is false.
        type: number
        x-customType: float64
      randomization_factor:
        description: RandomizationFactor a random factor between 0 and 1 used to calculate next backoffs (randomized interval = RetryInterval * (1 ± RandomizationFactor)); ignored if enabled is false.
        type: number
        x-customType: float64

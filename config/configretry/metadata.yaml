type: configretry
parent: config
github_project: open-telemetry/opentelemetry-collector

status:
  disable_codecov_badge: true
  class: pkg

exported_configs:
  back_off_config:
    description: Defines configuration for retrying batches in case of export failure. The current supported strategy is exponential backoff.
    type: object
    go_struct:
      custom_validator:
        name: validateMaxElapsedTime
    properties:
      enabled:
        description: Indicates whether to retry sending batches in case of export failure.
        type: bool
        default: true
      initial_interval:
        description: The time to wait after the first failure before retrying; ignored if enabled is false.
        type: duration
        default: 5s
        minimum: 0
      max_elapsed_time:
        description: The maximum amount of time (including retries) spent trying to send a request/batch; ignored if enabled is false. Once this value is reached, the data is discarded. If set to 0, the retries are never stopped.
        type: duration
        default: 5m
        minimum: 0
      max_interval:
        description: The upper bound on backoff interval; ignored if enabled is false. Once this value is reached the delay between consecutive retries will always be `MaxInterval`.
        type: duration
        default: 30s
        minimum: 0
      multiplier:
        description: The factor by which the backoff interval bounds are multiplied on each attempt; ignored if enabled is false.
        type: double
        default: 1.5
        minimum: 0
      randomization_factor:
        description: A random factor between 0 and 1 used to calculate next backoffs (randomized interval = RetryInterval * (1 ± RandomizationFactor)); ignored if enabled is false.
        type: double
        default: 0.5
        minimum: 0
        maximum: 1

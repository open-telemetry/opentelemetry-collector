type: test_versioned
sem_conv_version: 1.9.0
status:
  class: receiver
  stability:
    beta: [metrics]
  distributions: []

feature_gates:
  - id: receiver.test_versioned.DontEmitV0SystemConventions
    description: When enabled, semconv legacy metrics are disabled.
    stage: alpha
    from_version: v0.145.0
    reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/45592
  - id: receiver.test_versioned.EmitV1SystemConventions
    description: When enabled, semconv stable metrics are enabled.
    stage: alpha
    from_version: v0.145.0
    reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/45592

metrics:
  system.memory.utilization:
    enabled: false
    description: Memory utilization.
    stability: development
    unit: "1"
    gauge:
      value_type: double
    migration:
      to: system.memory.utilization@v1
      independent_value: true
      through_gates:
        disable_old: receiver.test_versioned.DontEmitV0SystemConventions
        enable_new: receiver.test_versioned.EmitV1SystemConventions
  system.memory.utilization@v1:
    enabled: false
    description: Memory utilization.
    stability: development
    unit: "1"
    gauge:
      value_type: double
